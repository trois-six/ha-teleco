[project]
name = "ha-teleco"
version = "0.1.0"
description = "Home Assistant integration for Teleco Automation boxes (Daisy and the other brand apps)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
# Runtime requirements live in custom_components/teleco/manifest.json (installed by HA).
dependencies = []

[dependency-groups]
dev = [
  "aioteleco==0.2.0",
  "mypy>=1.18",
  "pytest-homeassistant-custom-component==0.13.366",
  "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["custom_components.teleco"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components"]
explicit_package_bases = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "TRY", "N"]
# RUF012: Home Assistant entities declare their attributes as class-level sets / lists
ignore = ["TRY003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
